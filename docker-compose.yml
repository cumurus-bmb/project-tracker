services:
  app:
    build: .
    volumes:
      - .:/var/www/html
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=db
      - DB_DATABASE=project-tracker_db
      - DB_USERNAME=user
      - DB_PASSWORD=pass
      - MAIL_MAILER=smtp
      - MAIL_HOST=mailhog
      - MAIL_PORT=1025
      - MAIL_USERNAME=null
      - MAIL_PASSWORD=null
      - MAIL_ENCRYPTION=null
      - MAIL_FROM_ADDRESS=noreply@project-tracker.local
      - MAIL_FROM_NAME=ProjectTracker
      - QUEUE_CONNECTION=sync
    depends_on:
      - db
      - mailhog
    # Laravelインストール待ちの間、コンテナが死なないように待機させる
    # command: tail -f /dev/null
    command: php artisan serve --host=0.0.0.0 --port=8000


  db:
    image: mysql:8.0
    environment:
      - MYSQL_DATABASE=project-tracker_db
      - MYSQL_USER=user
      - MYSQL_PASSWORD=pass
      - MYSQL_ROOT_PASSWORD=root_pass
    volumes:
      - db-data:/var/lib/mysql
    ports:
      - "3306:3306"   # 

  node:
    image: node:20-alpine
    volumes:
      - .:/var/www/html
    working_dir: /var/www/html
    command: tail -f /dev/null
    ports:
      - "5173:5173"

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "8025:8025"   # Web UI

volumes:
  db-data:

